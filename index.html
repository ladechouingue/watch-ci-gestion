<html lang="fr">

<style>
/* Layout: one column app, tabs at the bottom on phone and on top from 760px. Dashboard first, then orders, stock, customers. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#14201b; --muted:#5b6a63; --line:#dce3df;
  --accent:#d95f0a; --accent-ink:#ffffff; --accent-soft:#fde8d6;
  --good:#1c7f54; --good-soft:#dcf3e7; --warn:#a96a08; --warn-soft:#fbefd2; --bad:#b8321f; --bad-soft:#fbe0db;
  --bar2:#14201b;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161e1a; --ink:#e7eeea; --muted:#93a39b; --line:#27332d;
  --accent:#ff8a3d; --accent-ink:#1a0d03; --accent-soft:#3a2412;
  --good:#4cc38a; --good-soft:#15352a; --warn:#e3a94a; --warn-soft:#3a2d12; --bad:#ff7d68; --bad-soft:#3d1c16;
  --bar2:#e7eeea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161e1a; --ink:#e7eeea; --muted:#93a39b; --line:#27332d;
  --accent:#ff8a3d; --accent-ink:#1a0d03; --accent-soft:#3a2412;
  --good:#4cc38a; --good-soft:#15352a; --warn:#e3a94a; --warn-soft:#3a2d12; --bad:#ff7d68; --bad-soft:#3d1c16;
  --bar2:#e7eeea; color-scheme:dark}
html{color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}#topFilter:not(:empty){margin:10px 0 0}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:8px 2px;border-radius:10px;color:var(--muted);font-weight:600;font-size:12.5px;min-width:0}
nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media(min-width:760px){
  nav{position:static;border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px}
  body{padding-block:24px 48px}
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
a.btn{text-align:center;text-decoration:none;color:var(--ink);display:inline-block}
a.btn.primary{color:var(--accent-ink)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid2 .f{min-width:0}input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;min-height:42px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.grid4{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.kpi small{color:var(--muted);font-size:12px;line-height:1.3}
.kpi b{font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.main b{color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.grid3{grid-template-columns:1fr 1fr}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:var(--line);color:var(--muted)}
.clickable{cursor:pointer;width:100%;text-align:left;background:none;border:0;padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.stepper .num{min-width:34px;text-align:center}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.backdrop{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:760px){.backdrop{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.itemrow{display:grid;grid-template-columns:1fr 64px 92px 32px;gap:6px;align-items:end}
@media(max-width:480px){.itemrow{grid-template-columns:1fr 56px 82px 30px}}
.toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;max-width:440px;margin:0 auto;text-align:center}
.sum{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
a{color:var(--accent)}
.thumb{width:54px;height:54px;border-radius:10px;flex:none;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:20px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:40px;height:40px;border-radius:8px;font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:6px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:9px 6px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl tr.zero td{color:var(--muted)}
.tbl .bar{height:4px;border-radius:99px;background:var(--line);margin-top:5px;min-width:70px}
.tbl .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.photo{display:flex;gap:12px;align-items:center}
.photo .thumb{width:84px;height:84px;border-radius:12px}
.auth{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}
.foot{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
.stockgrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:1000px){
  .wrap{max-width:1380px}
  .stockgrid{grid-template-columns:repeat(4,1fr)}
  .kpi b{font-size:26px}
  h1{font-size:26px}
}
@media(min-width:760px) and (max-width:999px){.stockgrid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.catname{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-width:0}.catname svg{flex:none;color:var(--accent);opacity:.85}
.catacts{gap:6px;flex-wrap:nowrap}.catacts .btn{padding-left:10px;padding-right:10px;white-space:nowrap}
.pickbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pickbtn .pk_t{color:var(--ink);font-weight:500}.pickbtn .pk_c{color:var(--muted)}
.pk_t{flex:1;min-width:0}.pkrow{display:flex;align-items:center;gap:8px}.pkrow small{color:var(--muted)}
.pkbd{z-index:60}.pkbd .sheet{max-height:85%}.pkbd input[type=search]{width:100%}
.pkitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pkitem .t,.pkitem .s{display:block}.pkitem .s{color:var(--muted);font-size:13px}
.itemrow>.f:first-child{grid-column:1/-1}.itemrow,.itemrow:not(x){grid-template-columns:90px 1fr 44px!important}
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]),select{min-height:44px}
select{-webkit-appearance:none;appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
a.btn.grow{display:block;text-align:center;flex:1}
.invframe{width:100%;height:58vh;min-height:320px;border:1px solid var(--line);border-radius:12px;background:#fff}
.setlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.setrow:last-child{border-bottom:0}.setrow .pk_c{font-size:20px;line-height:1}
#toTop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer}#toTop[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><small>Gestion</small><h1>Watch Côte d'Ivoire</h1></div>
    <div id="topRight"></div>
  </div>
  <div id="topFilter"></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div id="banner"></div>
  <main id="main"><div class="empty">Chargement des données…</div></main>
</div>
<button id="toTop" type="button" aria-label="Revenir en haut" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var nf=new Intl.NumberFormat("fr-FR");
var fmt=function(n){return nf.format(Math.round(n||0))};
var F=function(n){return fmt(n)+" F"};
var today=function(){return new Date().toISOString().slice(0,10)};
var monthLabel=function(k){return new Date(k+"-01T12:00:00Z").toLocaleDateString("fr-FR",{month:"long",year:"numeric",timeZone:"UTC"})};
var shortMonth=function(k){return new Date(k+"-01T12:00:00Z").toLocaleDateString("fr-FR",{month:"short",timeZone:"UTC"}).replace(".","")};
var dateLabel=function(d){return new Date(d+"T12:00:00Z").toLocaleDateString("fr-FR",{day:"numeric",month:"short",timeZone:"UTC"})};
var addMonths=function(k,n){var y=+k.slice(0,4),m=+k.slice(5,7)-1+n;var d=new Date(Date.UTC(y,m,1));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")};
var uid=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};

var PAGE_V=56;
var appVersion="",updInfo=null,authed=false, products=[], orders=[], expenses=[], tab="home", month=today().slice(0,7), ofilter="all", q="";
var META="Publicité Meta (Facebook et Instagram)";
var CHANNELS=["Site web","WhatsApp","Facebook","Instagram","TikTok","Autre"];
var MARCH="Achat de marchandises";
var MARCH_TYPES=["Bracelet","Coque","Antichoc","Câble","Chargeur","Verre protecteur","Autre"];
var EXP_CATS=[MARCH,META,"Emballage","Transport et déplacements","Abonnements et outils","Photos et contenu","Hébergement web","Nom de domaine","Autre"];
var STATUS={a_livrer:["À livrer","warn"],livre:["Livré","good"],annule:["Annulé","off"]};

/* ---------- accès au serveur ---------- */
function api(route,body,form){
  var opt={credentials:"same-origin",headers:{"X-Gestion":"1"}};
  if(form){opt.method="POST";opt.body=form}
  else if(body!==undefined){opt.method="POST";opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  return fetch("api.php?r="+route,opt).then(function(r){return r.json().catch(function(){return {error:"Réponse inattendue du serveur."}}).then(function(j){
    if(r.status===401&&route!=="login"){authed=false;renderAuth(false)}
    if(!r.ok)throw new Error(j.error||"Erreur "+r.status);
    return j})});
}
function refresh(){return api("state").then(function(st){products=st.products||[];orders=st.orders||[];expenses=(st.expenses||[]).map(function(e){if(e.category==="Site web")e.category="Hébergement web";if(e.category==="Publicité")e.category=META;return e});render()})}
function put(coll,id,data){return api("save",{coll:coll,id:id,data:data}).then(refresh)}
function patch(coll,id,obj){var list=coll==="orders"?orders:products;var cur=list.find(function(x){return x.id===id});var d=Object.assign({},cur,obj);delete d.id;return put(coll,id,d)}
function del(coll,id){return api("delete",{coll:coll,id:id}).then(refresh)}

/* ---------- calculs ---------- */
var MM_RATE=0.01;
function mmFee(o){if(!o||!o.paid||!o.mm||o.status==="annule")return 0;var r=0;(o.items||[]).forEach(function(i){r+=i.qty*i.price});return Math.round(r*MM_RATE)}
function calc(o){var rev=0,cost=0,qty=0;(o.items||[]).forEach(function(i){rev+=i.qty*i.price;cost+=i.qty*(i.cost||0);qty+=i.qty});var mm=mmFee(o);return {rev:rev,cost:cost,qty:qty,mm:mm,profit:rev-cost-(o.fee||0)-mm}}
function isOpex(e){return e.category!==MARCH}
function inRange(d){return month==="all"||(d||"").indexOf(month)===0}
var periodLabel=function(m){return m==="all"?"Toutes les années":m.length===4?"Année "+m:monthLabel(m)};
var MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function active(o){return o.status!=="annule"}
function thumbUrl(p){return p&&p.photo?p.photo.replace("uploads/","uploads/t_"):""}
function thumb(p,cls){var u=thumbUrl(p);return '<div class="thumb '+(cls||"")+'">'+(u?'<img loading="lazy" alt="" src="'+esc(u)+'">':esc(((p&&p.name)||"?").charAt(0).toUpperCase()))+'</div>'}
function label(p){return p.name+(p.size?" · "+p.size:"")+(p.color?" · "+p.color:"")}
function pById(id){return products.find(function(p){return p.id===id})}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3500)}
function guard(fn){return function(){var a=arguments;return Promise.resolve().then(function(){return fn.apply(null,a)}).catch(function(e){toast("Enregistrement impossible : "+(e&&e.message||"erreur"));})}}

/* ---------- rendu ---------- */
function renderNav(){
  var tabs=[["home","Accueil"],["orders","Commandes"],["stock","Stock"],["expenses","Dépenses"],["clients","Clients"]];
  $("#nav").innerHTML=tabs.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join("");
}
function render(){
  renderNav();

function resizeImage(file,max){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
      var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);c.toBlob(function(b){b?res(b):rej(new Error("Image illisible"))},"image/jpeg",.85)};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Format de photo non lisible. Essayez une photo JPEG ou PNG."))};
    img.src=url;
  });
}

};

/* ---------- mises à jour ---------- */
function checkUpdate(manual){
  return api("update_check").then(function(i){updInfo=i;render();if(manual)toast(i.available?"Une mise à jour est disponible.":"Vous avez la dernière version.")}).catch(function(e){if(manual)toast(e.message)});
}
function doUpdate(btn){
  btn.disabled=true;btn.textContent="Mise à jour…";
  api("update_apply",{}).then(function(j){toast("Mise à jour installée. Rechargement…");setTimeout(function(){location.href=location.pathname+"?v="+j.version},900)}).catch(function(e){btn.disabled=false;btn.textContent="Mettre à jour";toast(e.message)});
}

/* ---------- connexion et démarrage ---------- */
function renderAuth(setup,msg){
  $("#layer").innerHTML="";$("#nav").innerHTML="";$("#topRight").innerHTML="";$("#topFilter").innerHTML="";
  $("#main").innerHTML='<div class="auth card"><h2>'+(setup?'Créer votre mot de passe':'Connexion')+'</h2><p style="margin:0;color:var(--muted)">'+(setup?'Première visite. Choisissez un mot de passe d\'au moins 8 caractères. Il protège vos ventes, vos clients et votre stock.':'Entrez votre mot de passe pour accéder à la gestion.')+'</p><label class="f">Mot de passe<input id="pw" type="password" autocomplete="'+(setup?'new-password':'current-password')+'"></label><div class="err" id="autherr">'+esc(msg||"")+'</div><button class="btn primary" data-act="'+(setup?'setup':'login')+'">'+(setup?'Créer et entrer':'Se connecter')+'</button></div>';
  var p=$("#pw");if(p)p.focus();
}
function doAuth(setup){
  var pw=$("#pw").value;$("#autherr").textContent="";
  api(setup?"setup":"login",{password:pw}).then(function(){authed=true;boot()}).catch(function(e){$("#autherr").textContent=e.message})
}
function boot(){
  $("#main").innerHTML='<div class="empty">Chargement…</div>';
  refresh().then(function(){checkUpdate(false)}).catch(function(e){toast(e.message)});
}
var rzT=null;window.addEventListener("resize",function(){clearTimeout(rzT);rzT=setTimeout(function(){if(authed&&tab==="home"&&!$("#layer").children.length)render()},250)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&authed&&!$("#layer").children.length)refresh().catch(function(){})});
api("status").then(function(st){
  appVersion=st.version||"";
  if(appVersion&&String(PAGE_V)!==String(appVersion)&&location.search.indexOf("v="+appVersion)<0){location.replace(location.pathname+"?v="+appVersion);return}
  if(st.auth){authed=true;boot()}else renderAuth(st.setup);
}).catch(function(){$("#main").innerHTML='<div class="empty">Le serveur ne répond pas. Vérifiez que le fichier api.php est bien envoyé et que PHP est actif.</div>'});
})();

(function(){var b=document.getElementById("toTop");if(!b)return;
  function chk(){b.hidden=(window.pageYOffset||document.documentElement.scrollTop)<400}
  window.addEventListener("scroll",chk,{passive:true});chk();
  b.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});
})();
</script>
</body>
</html>
